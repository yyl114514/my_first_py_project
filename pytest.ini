[pytest]
testpaths = tests
addopts = 
        -ra
        --alluredir=reports/allure_temp
        --clean-alluredir
pythonpath = .

markers = 
    api: 接口测试
    web: UI测试
    ut: 单元测试
    login: 登录相关
    pay: 支付相关
    ddt: 参数化
    ft: fixture测试
    temp: 临时标记  
    brand: 商品品牌管理接口
    admin:后台用户管理接口
    